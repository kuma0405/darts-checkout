<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARTS LAB | Checkout Planner</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--card:#151e2b;--line:#29374a;--txt:#edf5ff;--muted:#a4b4c8;--accent:#55e0b1;--gold:#f8cb73;--red:#f77e83}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0%,#1d3343 0%,transparent 33%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt)}
main{max-width:850px;margin:auto;padding:25px 17px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:12px;letter-spacing:.28em;color:var(--accent);font-weight:800}.eyebrow{font-size:12px;color:var(--muted)}h1{margin:9px 0 5px;font-size:clamp(28px,5vw,41px);letter-spacing:-.04em}p{line-height:1.6}.sub{color:var(--muted);margin:0 0 24px}.pill{border:1px solid #3b645e;color:var(--accent);border-radius:999px;padding:8px 10px;font-size:12px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:14px 8px;background:#151e2b;color:#b9c8d9;border:1px solid var(--line);border-radius:13px;font-weight:750;cursor:pointer}.tab.active{background:#18362e;color:var(--accent);border-color:#317b62}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:21px;margin-bottom:15px;box-shadow:0 14px 35px #0002}.panel h2{font-size:17px;margin:0 0 15px}.inputrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:9px}.field input{width:100%;font-size:38px;font-weight:850;letter-spacing:.02em;background:#0b121d;border:1px solid #3a4b5f;color:#fff;padding:11px 15px;border-radius:13px;outline:0}.field input:focus{border-color:var(--accent)}.action{background:var(--accent);color:#081b17;border:0;border-radius:12px;padding:16px 19px;font-weight:850;cursor:pointer;min-height:57px}.small{padding:10px 15px;min-height:0}.hint{font-size:12px;color:var(--muted);margin-top:12px}.options{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.options label{color:var(--muted);font-size:13px}.options select{background:#0d1723;color:#edf5ff;border:1px solid var(--line);border-radius:9px;padding:8px}.resulthead{display:flex;justify-content:space-between;align-items:center;gap:10px}.resulthead h2{margin:0}.count{font-size:12px;color:var(--muted)}.route{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 0}.route:first-of-type{margin-top:12px}.throws{display:flex;gap:7px;flex-wrap:wrap}.dart{min-width:57px;text-align:center;border:1px solid #3a4b5f;background:#111b29;border-radius:11px;padding:10px 9px;font-size:17px;font-weight:800}.dart.finish{color:var(--accent);border-color:#3b987b;background:#12322b}.route .sum{color:var(--muted);font-size:12px;text-align:right;min-width:80px}.badge{font-size:11px;color:var(--gold);display:block;margin-top:2px}.empty{padding:25px 0;color:var(--muted);line-height:1.65}.note{border-left:3px solid var(--gold);padding:10px 12px;background:#28271f;color:#e8dbbd;font-size:12px;border-radius:0 8px 8px 0;margin:14px 0 0}.hidden{display:none}.foot{margin-top:20px;text-align:center;font-size:12px;color:#7e93a9}.chipbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.chip{background:#233345;border:1px solid #3c5268;color:#dce7f4;padding:7px 12px;border-radius:18px;cursor:pointer;font-size:13px}.chip:hover{border-color:var(--accent)}@media(max-width:520px){.inputrow{grid-template-columns:1fr}.action{width:100%}.panel{padding:17px}.dart{min-width:51px;padding:10px 6px}.route .sum{min-width:55px}.pill{display:none}}
</style></head><body><main>
<div class="top"><div class="brand">🎯 DARTS LAB</div><div class="pill">OFFLINE READY</div></div>
<h1>Checkout Planner</h1><p class="sub">01の上がり方を検索。好きな点数の3本組み合わせも試せる。</p>
<div class="tabs"><button class="tab active" id="tabCheckout" type="button">🎯 チェックアウト</button><button class="tab" id="tabCombo" type="button">⚡ 3本で点数を作る</button></div>
<section class="panel" id="checkoutPanel"><h2>残り点数を入力</h2><div class="inputrow"><div class="field"><label for="remaining">残りスコア（2〜170）</label><input id="remaining" type="number" inputmode="numeric" min="2" max="170" value="121"></div><button class="action" id="calcCheckout">ルートを探す →</button></div><div class="chipbar"><button class="chip" data-score="32">32</button><button class="chip" data-score="50">50</button><button class="chip" data-score="81">81</button><button class="chip" data-score="100">100</button><button class="chip" data-score="121">121</button><button class="chip" data-score="170">170</button></div><div class="options"><label for="checkoutDarts">最大投数</label><select id="checkoutDarts"><option value="3">3本</option><option value="2">2本</option><option value="1">1本</option></select><label for="finishRule">フィニッシュ</label><select id="finishRule"><option value="double">ダブルアウト</option><option value="master">マスターアウト</option><option value="single">シングルアウト</option></select></div><div class="hint">最後の1本は指定したアウトルールに従う。BULLは50点、アウターブルは25点で計算。</div></section>
<section class="panel hidden" id="comboPanel"><h2>3本で指定スコアを作る</h2><div class="inputrow"><div class="field"><label for="target">作りたい点数（0〜180）</label><input id="target" type="number" inputmode="numeric" min="0" max="180" value="100"></div><button class="action" id="calcCombo">組み合わせを探す →</button></div><div class="options"><label for="comboDarts">投数</label><select id="comboDarts"><option value="3">ちょうど3本</option><option value="2">ちょうど2本</option><option value="1">ちょうど1本</option></select></div><div class="hint">MISS（0点）も選択可能。ダブルアウトの制約はないよ。</div></section>
<section class="panel" aria-live="polite"><div class="resulthead"><h2 id="resultTitle">おすすめルート</h2><span id="resultCount" class="count"></span></div><div id="results"></div><p class="note" id="disclaimer">候補は計算上成立するルート。実戦では得意なナンバーや外した時の残り点数も考慮して選ぼう。</p></section>
<div class="foot">Made for darts practice · ローカルで動作 · データ送信なし</div>
</main><script>
'use strict';
const shots=[{label:'MISS',score:0,type:'miss',num:0}];
for(let n=1;n<=20;n++){shots.push({label:'S'+n,score:n,type:'single',num:n},{label:'D'+n,score:n*2,type:'double',num:n},{label:'T'+n,score:n*3,type:'triple',num:n});}
shots.push({label:'OB',score:25,type:'single',num:25},{label:'BULL',score:50,type:'double',num:25});
const possible=shots.filter(s=>s.score>0);
function finishAllowed(s,rule){if(rule==='single')return s.score>0;if(rule==='master')return s.type==='double'||s.type==='triple';return s.type==='double'}
function throwPref(s){if(s.label==='BULL')return 22;if(s.type==='triple')return (s.num===20?34:s.num===19?31:s.num===18?28:12);if(s.type==='double')return (s.num===16?31:s.num===20?28:s.num===18?25:17);return s.num===20?18:7}
function checkoutScore(route){let sc=route.reduce((a,s)=>a+throwPref(s),0);sc-=route.length*70;const last=route.at(-1);if(last.label==='D16')sc+=33;if(last.label==='D20')sc+=28;if(last.label==='D8')sc+=18;if(last.label==='BULL')sc+=4;return sc}
function routeText(route){return route.map(s=>s.label).join(' → ')}
function checkout(target,maxDarts,rule){if(!Number.isInteger(target)||target<2||target>170)return[];const finishes=possible.filter(s=>finishAllowed(s,rule));const found=[];for(let count=1;count<=maxDarts;count++){const dfs=(route,total)=>{const remaining=count-route.length;if(remaining===1){for(const last of finishes){if(total+last.score===target)found.push([...route,last])}return}for(const s of possible){if(total+s.score>=target)continue;if(total+s.score+ (remaining-1)*60<target)continue;dfs([...route,s],total+s.score)}};dfs([],0)}
const unique=new Map();for(const route of found){const key=routeText(route);if(!unique.has(key))unique.set(key,route)}return [...unique.values()].sort((a,b)=>a.length-b.length||checkoutScore(b)-checkoutScore(a)||routeText(a).localeCompare(routeText(b))).slice(0,12)}
function combos(target,count){if(!Number.isInteger(target)||target<0||target>180)return[];const found=[];const dfs=(route,total,start)=>{if(route.length===count){if(total===target)found.push([...route]);return}for(let i=start;i<shots.length;i++){let s=shots[i];if(total+s.score>target)continue;dfs([...route,s],total+s.score,i)}};dfs([],0,0);return found.sort((a,b)=>b.reduce((x,s)=>x+throwPref(s),0)-a.reduce((x,s)=>x+throwPref(s),0)).slice(0,12)}
function render(routes,mode,score){document.getElementById('resultTitle').textContent=mode==='checkout'?'おすすめルート':'スコアの組み合わせ';document.getElementById('resultCount').textContent=routes.length?`上位 ${routes.length} 件`:'';const el=document.getElementById('results');el.replaceChildren();if(!routes.length){const e=document.createElement('div');e.className='empty';e.textContent=mode==='checkout'?`残り${score}点は指定条件で上がれるルートが見つからなかったよ。投数やアウトルールを変更してみて。`:'この条件では組み合わせが見つからなかったよ。';el.append(e);return}routes.forEach((route,i)=>{let row=document.createElement('div');row.className='route';let left=document.createElement('div');left.className='throws';route.forEach((shot,index)=>{const d=document.createElement('span');d.className='dart'+(mode==='checkout'&&index===route.length-1?' finish':'');d.textContent=shot.label;left.append(d)});let info=document.createElement('div');info.className='sum';info.textContent=`合計 ${route.reduce((a,s)=>a+s.score,0)}点`;if(i===0){const badge=document.createElement('span');badge.className='badge';badge.textContent='★ おすすめ';info.append(badge)}row.append(left,info);el.append(row)})}
function runCheckout(){const score=Number(document.getElementById('remaining').value),darts=Number(document.getElementById('checkoutDarts').value),rule=document.getElementById('finishRule').value;render(checkout(score,darts,rule),'checkout',score)}
function runCombo(){const score=Number(document.getElementById('target').value),darts=Number(document.getElementById('comboDarts').value);render(combos(score,darts),'combo',score)}
function setMode(mode){const isCheckout=mode==='checkout';document.getElementById('checkoutPanel').classList.toggle('hidden',!isCheckout);document.getElementById('comboPanel').classList.toggle('hidden',isCheckout);document.getElementById('tabCheckout').classList.toggle('active',isCheckout);document.getElementById('tabCombo').classList.toggle('active',!isCheckout);document.getElementById('disclaimer').textContent=isCheckout?'候補は計算上成立するルート。実戦では得意なナンバーや外した時の残り点数も考慮して選ぼう。':'組み合わせは計算上の候補。投げやすいナンバーを優先して選ぼう。';if(isCheckout)runCheckout();else runCombo()}
document.getElementById('tabCheckout').addEventListener('click',()=>setMode('checkout'));document.getElementById('tabCombo').addEventListener('click',()=>setMode('combo'));document.getElementById('calcCheckout').addEventListener('click',runCheckout);document.getElementById('calcCombo').addEventListener('click',runCombo);['remaining','checkoutDarts','finishRule'].forEach(id=>document.getElementById(id).addEventListener('change',runCheckout));['target','comboDarts'].forEach(id=>document.getElementById(id).addEventListener('change',runCombo));document.querySelectorAll('[data-score]').forEach(el=>el.addEventListener('click',()=>{document.getElementById('remaining').value=el.dataset.score;runCheckout()}));runCheckout();
</script></body></html>
